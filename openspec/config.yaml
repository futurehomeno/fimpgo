schema: spec-driven

context: |
  # fimpgo

  Go library for the Futurehome FIMP protocol over MQTT: message model, topic addresses, MQTT
  transport and sync client, and the `fimptype` enums (resource types/names, service names,
  value and message types). Consumers are cliffhanger, the edge adapters and the hub/cloud apps,
  so exported identifiers are API: add freely, never rename or remove without a deprecation.
